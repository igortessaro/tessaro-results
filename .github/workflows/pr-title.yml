name: PR title

# Enforces the pull request title standard (ADR 0005).
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }} # via env, never interpolated into the script
        run: bash .github/scripts/check-pr-title.sh "$PR_TITLE"
