version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      test:
        patterns: ["xunit*", "Shouldly", "coverlet*"]
    commit-message:
      prefix: "Deps |" # PR title standard, ADR 0005; no colon is added after "|"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "Deps |"
